name: Deploy SGS Fullstack to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy SGS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "── Starting Automated Deployment for SGS Monorepo ──"
            DEPLOY_DIR="/var/www/SGS"

            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Directory $DEPLOY_DIR does not exist. Cloning repository..."
              git clone https://github.com/jawaleritesh1/sanskar.git "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"
            echo "Fetching latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building and launching SGS containers (Frontend + Backend + DB)..."
            docker compose down || true
            docker compose up -d --build

            echo "Cleaning up dangling images..."
            docker image prune -f

            echo "Verifying SGS services status..."
            docker compose ps

            echo "✅ SGS Fullstack deployment successfully completed!"
